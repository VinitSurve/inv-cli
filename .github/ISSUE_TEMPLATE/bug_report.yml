name: Bug Report
description: Report an issue or unexpected behavior in Inventory CLI
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue in Inventory CLI (`inv`). Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: What commands did you run?
      placeholder: |
        1. Run `inv scan`
        2. Run `inv tools`
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Run `inv doctor` and paste the output here.
    validations:
      required: true

