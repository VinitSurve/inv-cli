name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'testpypi' to confirm publishing to TestPyPI"
        required: true
        default: ""

# Prevent concurrent publishing jobs
concurrency:
  group: release-testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Validate Distribution
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'testpypi'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Build sdist and wheel
        run: uv build

      - name: Validate package with twine
        run: uvx twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-testpypi
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish-testpypi:
    name: Publish to TestPyPI via Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/inv
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions-testpypi
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          print-hash: true
